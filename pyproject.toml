[project]
name = "cogame-cogolf"
version = "0.1.0"
description = "Cogolf: a nine-hole adversarial-programming match between two code agents — write the implementation a careful spec author meant, and tests that break the other reading"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiohttp>=3.10",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "pydantic>=2.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/cogame_cogolf", "players"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: long-running behavioral tests (deselect with -m 'not slow')",
]

[dependency-groups]
dev = [
    "coworld==0.1.56",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
